<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sentinela</title>
<meta name="description" content="Alertas oficiais, atividade de emergência, abrigos e guias para Portugal. Gratuito.">
<meta name="theme-color" content="#121212">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="vendor/leaflet.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&family=Roboto+Mono:wght@500&display=swap">
<style>
/* Layout: app escura de telemóvel — painel de blocos, mapa de ecrã inteiro com fichas em baixo, perfil em lista; 3 separadores */
:root{
  --bg:#121212; --s1:#1e1e1e; --s2:#2d2d2d; --s3:#3a3a3a; --line:#2f2f2f;
  --fg:#e6e1e5; --fg2:#cac4d0; --muted:#938f99;
  --y:#ffeb3b; --y-d:#fbc02d; --y-c:#3b3610; --on-y:#1a1700;
  --navy:#162036; --navy2:#0f1729;
  --red:#ff5449; --orange:#ff9800; --amber:#ffd54f; --green:#4caf50; --blue:#4fc3f7; --purple:#b388ff;
  --font:Roboto,system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"Roboto Mono",ui-monospace,monospace;
  --nav:68px; color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 var(--font);-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--y)}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--y);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:13px}
svg.i{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
svg.i.s{width:18px;height:18px}

/* ---------- Estrutura ---------- */
.screen{min-height:100%;padding:calc(env(safe-area-inset-top,0px) + 12px) max(16px,env(safe-area-inset-right,0px)) calc(var(--nav) + env(safe-area-inset-bottom,0px) + 24px) max(16px,env(safe-area-inset-left,0px));max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
nav.bar{position:fixed;left:0;right:0;bottom:0;z-index:800;background:#1a1a1a;border-top:1px solid var(--line);height:calc(var(--nav) + env(safe-area-inset-bottom,0px));padding:0 env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);display:grid;grid-template-columns:repeat(3,1fr)}
nav.bar button{background:none;border:0;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;font-weight:500;cursor:pointer}
nav.bar button .pillic{width:64px;height:32px;border-radius:16px;display:grid;place-items:center;transition:background .2s}
nav.bar button[aria-current="page"]{color:var(--fg)}
nav.bar button[aria-current="page"] .pillic{background:var(--y-c);color:var(--y)}

/* ---------- Topo do painel ---------- */
.dhead{display:flex;align-items:center;gap:10px}
.dhead h1{font-size:26px;font-weight:900;margin:0;letter-spacing:-.01em}
.dhead .sp{flex:1}
.rbtn{width:40px;height:40px;border-radius:20px;border:0;background:var(--s1);display:grid;place-items:center;cursor:pointer;color:var(--fg)}
.rbtn.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.rbtn.spin svg{animation:none}}
.places{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:0 max(16px,env(safe-area-inset-left,0px))}
.places::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--s3);background:transparent;border-radius:8px;padding:7px 12px;font-size:13.5px;font-weight:500;cursor:pointer;white-space:nowrap;color:var(--fg2)}
.chip[aria-pressed="true"]{background:var(--y-c);border-color:transparent;color:var(--y)}
.chip.add{border-style:dashed}
.banner{border-radius:16px;padding:14px 16px;display:flex;gap:12px;align-items:flex-start;background:var(--s1)}
.banner.y{background:var(--y-c);color:#fff8c4}
.banner .b-t{font-weight:700}
.banner .b-s{font-size:13.5px;color:var(--fg2);margin-top:2px}
.banner.y .b-s{color:#f1e7a2}
.banner .acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}

/* ---------- Blocos ---------- */
.w{background:var(--s1);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px}
.wh{display:flex;align-items:center;gap:10px}
.wh h2{margin:0;font-size:17px;font-weight:700;flex:1;min-width:0}
.wh .lnk{background:none;border:0;color:var(--y);font-weight:500;font-size:14px;cursor:pointer;padding:4px 0}
.tag{display:inline-flex;align-items:center;gap:4px;border-radius:6px;padding:2px 7px;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.tag.live{background:var(--red);color:#fff}
.tag.off{background:var(--y);color:var(--on-y)}
.tag.urg{background:#5c1612;color:#ffb4ab}
.tag.g{background:var(--s2);color:var(--fg2)}
.btn{border:0;border-radius:20px;padding:10px 18px;font-weight:500;font-size:14px;cursor:pointer;background:var(--s2);color:var(--fg);display:inline-flex;align-items:center;gap:8px;justify-content:center}
a.btn{text-decoration:none}
.btn.y{background:var(--y);color:var(--on-y)}
.btn.t{background:transparent;color:var(--y);padding:10px 8px}
.btn.o{background:transparent;border:1px solid var(--s3)}
.btn.full{width:100%}

.clear{display:flex;gap:14px;align-items:center;padding:4px 0}
.clear .ok{width:44px;height:44px;border-radius:22px;background:#173d1c;color:var(--green);display:grid;place-items:center;flex:none}
.clear b{display:block;font-size:15.5px}
.alert{border-radius:14px;background:var(--s2);padding:12px 14px;display:flex;gap:12px;cursor:pointer;border:0;text-align:left;width:100%}
.alert .lv{width:6px;border-radius:3px;background:var(--lc);flex:none}
.alert .at{font-weight:700}
.alert .as{font-size:13px;color:var(--fg2)}
.alert .ap{font-size:12.5px;color:var(--muted);font-family:var(--mono);margin-top:2px}

.act{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%}
.act:first-of-type{border-top:0;padding-top:0}
.ai{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;flex:none;background:var(--ac-bg);color:var(--ac)}
.am{min-width:0;flex:1}
.am .t{font-weight:600;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.am .s,.am .m{display:block}
.am .s{font-size:13px;color:var(--fg2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.am .m{font-size:12px;color:var(--muted);font-family:var(--mono)}
.ar{text-align:right;font-size:12.5px;color:var(--muted);white-space:nowrap;font-family:var(--mono)}

.stories{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
.stories::-webkit-scrollbar{display:none}
.story{flex:none;width:220px;border-radius:16px;padding:12px;background:linear-gradient(160deg,var(--st1),var(--st2));border:0;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:8px;min-height:132px;color:#fff}
.story .st-t{font-weight:700;font-size:15px;line-height:1.3;text-wrap:balance}
.story .st-s{font-size:12px;opacity:.85;margin-top:auto}

.mini{position:relative;height:190px;border-radius:14px;overflow:hidden;background:var(--s2);cursor:pointer}
.mini .mm{position:absolute;inset:0}
.mini .cnts{position:absolute;left:10px;bottom:10px;display:flex;gap:6px;flex-wrap:wrap;z-index:500}
.mini .cnts span{background:rgba(18,18,18,.88);border-radius:8px;padding:4px 8px;font-size:12px;font-weight:500}

.wx{display:flex;align-items:center;gap:14px}
.wx .tmp{font-size:44px;font-weight:300;letter-spacing:-.03em;line-height:1}
.fc{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:12px}
.fc div{background:var(--s2);border-radius:10px;padding:8px 2px;display:flex;flex-direction:column;gap:3px;align-items:center}
.fc b{font-weight:600;font-size:13px}
.fc .ic{font-size:0}
.env{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.env div{background:var(--s2);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:2px}
.env .k{font-size:11.5px;color:var(--muted)}
.env .v{font-size:18px;font-weight:700}
.env .q{font-size:12px;font-weight:500;color:var(--qc)}
.svc{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.svc a{background:var(--s2);border-radius:12px;padding:10px 4px;text-decoration:none;color:var(--fg);text-align:center;font-size:12.5px;font-weight:500;display:flex;flex-direction:column;align-items:center;gap:6px}
.svc a i{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-style:normal;font-weight:900;font-size:12px;color:#fff;background:var(--sc)}
@media (max-width:380px){.svc{grid-template-columns:repeat(3,1fr)}}
.err{color:#ffb4ab;font-size:13px}
.empty{color:var(--muted);font-size:14px;padding:6px 0}
.foot{font-size:12px;color:var(--muted);line-height:1.6}

/* ---------- Mapa ---------- */
#v-mapa{position:fixed;inset:0;z-index:1}
#map{position:absolute;inset:0;background:#0e0e0e}
.mtop{position:absolute;z-index:600;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 10px) max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:10px;pointer-events:none}
.msearch{pointer-events:auto;display:flex;align-items:center;gap:10px;background:var(--s1);border-radius:28px;padding:0 6px 0 16px;height:52px;box-shadow:0 2px 10px rgba(0,0,0,.5)}
.msearch input{flex:1;min-width:0;background:none;border:0;outline:none;font-size:15.5px;height:100%}
.msearch input::placeholder{color:var(--muted)}
.modes{pointer-events:auto;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
.modes::-webkit-scrollbar{display:none}
.modes .chip{background:var(--s1);border-color:var(--s1);box-shadow:0 1px 6px rgba(0,0,0,.4);color:var(--fg)}
.modes .chip[aria-pressed="true"]{background:var(--y);color:var(--on-y)}
.sres{pointer-events:auto;background:var(--s1);border-radius:16px;max-height:50vh;overflow:auto;box-shadow:0 4px 18px rgba(0,0,0,.5)}
.sres button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:12px 16px;cursor:pointer}
.sres button:first-child{border-top:0}
.mfab{position:absolute;z-index:600;right:max(12px,env(safe-area-inset-right,0px));bottom:calc(var(--nav) + env(safe-area-inset-bottom,0px) + 16px);display:flex;flex-direction:column;gap:10px}
.mfab button{width:48px;height:48px;border-radius:16px;border:0;background:var(--s1);color:var(--fg);display:grid;place-items:center;box-shadow:0 2px 10px rgba(0,0,0,.5);cursor:pointer;font-weight:700;font-size:12px}
.mlegend{position:absolute;z-index:600;left:max(12px,env(safe-area-inset-left,0px));bottom:calc(var(--nav) + env(safe-area-inset-bottom,0px) + 16px);background:rgba(30,30,30,.92);border-radius:12px;padding:6px 10px;font-size:12px;color:var(--fg2);max-width:60%}
.leaflet-container{background:#0e0e0e;font-family:var(--font)}
.leaflet-control-attribution{background:rgba(18,18,18,.7)!important;color:#888!important;font-size:10px!important}
.leaflet-control-attribution a{color:#aaa!important}
.leaflet-control-zoom{display:none}
.pin{width:30px;height:30px;border-radius:50% 50% 50% 4px;transform:rotate(-45deg);display:grid;place-items:center;border:2px solid #121212;box-shadow:0 1px 4px rgba(0,0,0,.6)}
.pin>*{transform:rotate(45deg)}
.dotm{border-radius:50%;border:2px solid #121212;box-shadow:0 0 0 2px var(--dc);display:grid;place-items:center;color:#121212;font:900 10px/1 var(--font)}
.clus{background:#ff5722;color:#fff;border-radius:50%;display:grid;place-items:center;font:700 12px var(--font);border:2px solid #121212}

/* ---------- Ficha (bottom sheet) ---------- */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:900}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:901;background:var(--s1);border-radius:24px 24px 0 0;max-height:82vh;overflow:auto;padding:8px max(18px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 20px) max(18px,env(safe-area-inset-left,0px));max-width:720px;margin:0 auto;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.grab{width:36px;height:4px;border-radius:2px;background:var(--s3);margin:4px auto 14px}
.sheet h3{margin:6px 0 4px;font-size:21px;font-weight:700;line-height:1.25;text-wrap:balance}
.sheet .kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px;margin:12px 0}
.sheet .kv dt{color:var(--muted)} .sheet .kv dd{margin:0}
.sheet .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.sheet p{color:var(--fg2);margin:8px 0}

/* ---------- Perfil e páginas ---------- */
.ptitle{display:flex;align-items:center;gap:8px}
.ptitle h1{font-size:26px;font-weight:900;margin:0}
.back{background:none;border:0;color:var(--fg);width:40px;height:40px;border-radius:20px;display:grid;place-items:center;cursor:pointer;margin-left:-8px}
.group{background:var(--s1);border-radius:20px;overflow:hidden}
.gtitle{font-size:13px;font-weight:500;color:var(--y);margin:8px 4px -6px;letter-spacing:.02em}
.item{display:flex;align-items:center;gap:14px;padding:14px 16px;width:100%;background:none;border:0;border-top:1px solid var(--line);text-align:left;cursor:pointer;color:var(--fg)}
.group>.item:first-child,.group>:first-child{border-top:0}
.item .ii{width:40px;height:40px;border-radius:12px;background:var(--s2);display:grid;place-items:center;flex:none;color:var(--y)}
.item .it{flex:1;min-width:0}
.item .it b{display:block;font-weight:500;font-size:15.5px}
.item .it span{font-size:13px;color:var(--muted)}
.item .iv{color:var(--muted);font-size:14px}
.item.danger{color:#ffb4ab} .item.danger .ii{color:#ffb4ab}
.sw{appearance:none;width:52px;height:32px;border-radius:16px;background:var(--s3);position:relative;cursor:pointer;flex:none;transition:background .15s;border:2px solid var(--s3)}
.sw::after{content:"";position:absolute;top:4px;left:4px;width:20px;height:20px;border-radius:50%;background:var(--muted);transition:all .15s}
.sw:checked{background:var(--y);border-color:var(--y)}
.sw:checked::after{left:24px;width:24px;height:24px;top:2px;background:var(--on-y)}
.ffoot{font-size:12.5px;color:var(--muted);padding:0 6px;margin-top:-8px}
select.sel,input.inp{background:var(--s2);border:0;border-radius:12px;padding:10px 12px;color:var(--fg);max-width:55%}
input.inp{max-width:100%;width:100%}
.guide h1{font-size:28px;font-weight:900;margin:0;text-wrap:balance}
.guide .lead{color:var(--fg2);font-size:16px}
.guide .key{background:var(--y);color:var(--on-y);border-radius:16px;padding:14px 16px;font-weight:700;font-size:16px}
.guide ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;color:var(--fg2)}
.guide h4{margin:0;font-size:16px}
.kit li{list-style:none;margin-left:-20px;display:flex;gap:12px;align-items:flex-start}
.kit input[type=checkbox]{width:22px;height:22px;accent-color:var(--y);flex:none;margin:0}
.kit .rm{margin-left:auto;background:none;border:0;color:var(--muted);cursor:pointer}
.prog{height:8px;border-radius:4px;background:var(--s2);overflow:hidden}
.prog i{display:block;height:100%;background:var(--y);border-radius:4px}
.nums{display:grid;grid-template-columns:1fr auto;gap:10px 12px;align-items:center}
.nums b{font-family:var(--mono);font-size:17px;color:var(--y)}
.custom li{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);list-style:none}
.custom li:first-child{border-top:0}
.custom{padding:0 16px;margin:0}
.custom .mv{background:var(--s2);border:0;border-radius:8px;width:34px;height:34px;cursor:pointer;color:var(--fg)}

/* ---------- Início guiado ---------- */
#onb{position:fixed;inset:0;z-index:2000;background:var(--navy);display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 12px) max(24px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 24px) max(24px,env(safe-area-inset-left,0px))}
#onb .skip{align-self:flex-end;background:none;border:0;color:var(--fg2);font-weight:500;padding:8px;cursor:pointer}
#onb .art{flex:1;display:grid;place-items:center;min-height:0}
#onb .art svg{width:min(88vw,380px);height:auto;max-height:44vh}
#onb h1{font-size:34px;font-weight:900;line-height:1.08;margin:0 0 10px;white-space:pre-line;letter-spacing:-.01em}
#onb p{color:#c5cbe0;font-size:16px;margin:0 0 18px;max-width:46ch}
#onb .dots{display:flex;gap:6px;margin-bottom:18px}
#onb .dots i{width:8px;height:8px;border-radius:4px;background:#3a4669}
#onb .dots i.on{width:24px;background:var(--y)}
#onb .ochips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
#onb .ochips span{border:1px solid #3a4669;border-radius:8px;padding:6px 10px;font-size:13px;color:#dfe4f5}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav) + env(safe-area-inset-bottom,0px) + 16px);background:#e6e1e5;color:#1c1b1f;padding:12px 18px;border-radius:12px;font-size:14px;z-index:3000;max-width:calc(100% - 32px);box-shadow:0 4px 14px rgba(0,0,0,.5)}
</style>
</head>
<body>

<!-- ================= PAINEL ================= -->
<section id="v-painel" class="screen">
  <div class="dhead">
    <h1>Sentinela</h1><span class="sp"></span>
    <button class="rbtn" id="refreshBtn" aria-label="Atualizar"><svg class="i s" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.6"/><path d="M20 4v5h-5"/></svg></button>
    <button class="rbtn" id="customBtn" aria-label="Personalizar painel"><svg class="i s" viewBox="0 0 24 24"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg></button>
  </div>
  <div class="places" id="places"></div>
  <div id="offlineBanner" class="banner" hidden><svg class="i" viewBox="0 0 24 24"><path d="M2 8.8a15 15 0 0 1 4.2-2.6M10.7 5a15 15 0 0 1 11.3 3.8M5 12.9a10 10 0 0 1 5.2-2.8M19 12.9a10 10 0 0 0-2.6-1.9M8.5 16.4a5 5 0 0 1 7 0M12 20h0M2 2l20 20"/></svg><div><div class="b-t">Está offline</div><div class="b-s">A mostrar dados guardados. Ligue-se para atualizar.</div></div></div>
  <div id="notifBanner" class="banner y" hidden><svg class="i" viewBox="0 0 24 24"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"/></svg><div style="flex:1"><div class="b-t">Receba os alertas de emergência</div><div class="b-s">Seja avisado quando houver um alerta perto de si.</div><div class="acts"><button class="btn y" id="nbOn">Ativar notificações</button><button class="btn t" id="nbOff">Agora não</button></div></div></div>
  <div id="widgets" style="display:flex;flex-direction:column;gap:16px"></div>
  <div class="foot" id="lastUpd"></div>
</section>

<!-- ================= MAPA ================= -->
<section id="v-mapa" hidden>

  <div class="mtop">

/* Pedido com timeout, proxy opcional e cópia local */
async function getJSON(url,{key,ttl=0,opts={}}={}){
  const ck=key?"c:"+key:null;
  if(ck&&ttl){ const c=LS.get(ck); if(c&&Date.now()-c.t<ttl) return {data:c.d,t:c.t,cached:true}; }
  const ctrl=new AbortController(); const tm=setTimeout(()=>ctrl.abort(),20000);
  try{
    const r=await fetch(cfg.proxy?cfg.proxy+encodeURIComponent(url):url,Object.assign({signal:ctrl.signal,cache:"no-store"},opts));
    if(!r.ok) throw new Error("HTTP "+r.status);
    const d=await r.json(); if(ck) LS.set(ck,{t:Date.now(),d}); return {data:d,t:Date.now()};
  }catch(e){ if(ck){ const c=LS.get(ck); if(c) return {data:c.d,t:c.t,stale:true}; } throw e; }
  finally{ clearTimeout(tm); }
}

function here(){ if(cfg.sel==="me") return cfg.me; return cfg.cities.find(c=>c.id===cfg.sel)||cfg.me; }
function nearestArea(lat,lon){ let b=null,bd=1e9; for(const[k,v] of Object.entries(AREAS)){ const d=km(lat,lon,v[1],v[2]); if(d<bd){bd=d;b=k;} } return b; }
const areaName=a=>AREAS[a]?AREAS[a][0]:a;

const S={ warnings:[], act:[], actSrc:"", quakes:[], rcm:{}, wx:null, aq:null, outages:null, shelters:[], meta:{}, fails:[] };

async function loadWarnings(){
  const r=await getJSON(IPMA+"/forecast/warnings/warnings_www.json",{key:"warn"}); S.meta.warn=r; const now=Date.now();
  S.warnings=(Array.isArray(r.data)?r.data:[]).filter(w=>w&&w.awarenessLevelID&&w.awarenessLevelID!=="green")
    .map(w=>({id:[w.idAreaAviso,w.awarenessTypeName,w.awarenessLevelID,w.startTime].join("|"),area:w.idAreaAviso,type:TYPEPT[w.awarenessTypeName]||w.awarenessTypeName||"Aviso",
      lvl:w.awarenessLevelID,start:new Date(w.startTime),end:new Date(w.endTime),text:(w.text||"").trim()}))
    .filter(w=>isNaN(w.end)||w.end.getTime()>now).sort((a,b)=>(LVL[b.lvl]-LVL[a.lvl])||(a.start-b.start));
  const h=LS.get("hist",[]),ks=new Set(h.map(x=>x.id));
  S.warnings.forEach(w=>{ if(!ks.has(w.id)) h.unshift({id:w.id,area:w.area,type:w.type,lvl:w.lvl,start:w.start.toISOString(),end:w.end.toISOString(),text:w.text}); });
  LS.set("hist",h.filter(x=>new Date(x.end)>Date.now()-30*864e5).slice(0,400));
}

/* --- Ocorrências: Proteção Civil (ArcGIS do portal prociv.gov.pt) com fogos.pt como alternativa --- */
const PROCIV_PORTAL="https://prociv-portal.geomai.mai.gov.pt/arcgis";
const PROCIV_APP="29e83f11f7a34339b35364e483e3846f";
async function procivLayers(){
  const cached=LS.get("procivLayers"); if(cached&&Date.now()-cached.t<7*864e5&&cached.urls.length) return cached.urls;
  const urls=new Set(), items=new Set();
  const scan=o=>{ const s=JSON.stringify(o); (s.match(/https?:\\?\/\\?\/[^"\\]+?\/(?:FeatureServer|MapServer)\/\d+/g)||[]).forEach(u=>urls.add(u.replace(/\\\//g,"/")));
    (s.match(/"itemId"\s*:\s*"([0-9a-f]{32})"/g)||[]).forEach(m=>items.add(m.match(/[0-9a-f]{32}/)[0])); };
  const app=await getJSON(`${PROCIV_PORTAL}/sharing/rest/content/items/${PROCIV_APP}/data?f=json`); scan(app.data);
  for(const id of [...items].slice(0,8)){
    try{ const info=await getJSON(`${PROCIV_PORTAL}/sharing/rest/content/items/${id}?f=json`);
      if(info.data&&info.data.url&&/FeatureServer|MapServer/.test(info.data.url)){ const u=info.data.url.replace(/\/$/,""); /\/\d+$/.test(u)?urls.add(u):urls.add(u+"/0"); }
      const d=await getJSON(`${PROCIV_PORTAL}/sharing/rest/content/items/${id}/data?f=json`); scan(d.data);
      (d.data&&d.data.operationalLayers||[]).forEach(l=>{ if(l.url){ const u=l.url.replace(/\/$/,""); urls.add(/\/\d+$/.test(u)?u:u+"/0"); } });
    }catch(e){}
  }
  const list=[...urls]; if(list.length) LS.set("procivLayers",{t:Date.now(),urls:list}); return list;
}
function pick(o,re){ for(const k in o){ if(re.test(k)&&o[k]!=null&&o[k]!=="") return o[k]; } return null; }
function toDate(v){ if(v==null) return null; if(typeof v==="number") return new Date(v>1e11?v:v*1000); const s=String(v); const m=s.match(/^(\d{2})[-\/](\d{2})[-\/](\d{4})[ T]?(\d{2}:\d{2})?/); if(m) return new Date(`${m[3]}-${m[2]}-${m[1]}T${m[4]||"00:00"}:00`); const d=new Date(s); return isNaN(d)?null:d; }
async function loadProciv(){
  const layers=await procivLayers(); if(!layers.length) throw new Error("sem camadas");
  const out=[];
  for(const u of layers.slice(0,6)){
    try{
      const r=await getJSON(`${u}/query?where=1%3D1&outFields=*&outSR=4326&returnGeometry=true&resultRecordCount=2000&f=json`);
      for(const f of (r.data.features||[])){
        const g=f.geometry||{}, a=f.attributes||{}; const lat=+(g.y??pick(a,/^lat/i)), lon=+(g.x??pick(a,/^lon|^lng/i)); if(!isFinite(lat)||!isFinite(lon)||!lat) continue;
        out.push({ id:"pc"+(pick(a,/^(objectid|fid|id|numero|n_?ocorr)/i)??(lat+","+lon)), lat, lon,
          nat:String(pick(a,/natureza|descri|tipo/i)||"Ocorrência"), status:String(pick(a,/estado|status|fase|situa/i)||""),
          loc:[pick(a,/localidade|^local$|lugar/i),pick(a,/freguesia/i),pick(a,/concelho|municip/i)].filter(Boolean).join(", "),
          district:String(pick(a,/distrito/i)||""), man:+pick(a,/operac|humanos|^man$|operacionais/i)||0, terrain:+pick(a,/terrest|veic/i)||0, aerial:+pick(a,/aere|aére/i)||0,
          time:toDate(pick(a,/data|hora|inicio|date|dt/i)), important:/import|signific|relev/i.test(JSON.stringify(a)) && /sim|true|1/i.test(String(pick(a,/import|signific|relev/i))) });
      }
    }catch(e){}
  }
  if(!out.length) throw new Error("sem ocorrências");
  return out;
}
async function loadFogos(){
  const r=await getJSON("https://api.fogos.pt/v2/incidents/active",{key:"fogos"}); const arr=(r.data&&(r.data.data||r.data))||[];
  return (Array.isArray(arr)?arr:[]).map(f=>{ let t=f.dateTime&&f.dateTime.sec?new Date(f.dateTime.sec*1000):null; if(!t&&f.date&&f.hour){ const[d,m,y]=String(f.date).split("-"); t=new Date(`${y}-${m}-${d}T${f.hour}:00`); }
    return {id:"fg"+f.id,lat:+f.lat,lon:+(f.lng??f.lon),nat:f.natureza||"Ocorrência",status:f.status||"",loc:[f.localidade,f.freguesia,f.concelho].filter(Boolean).join(", ")||f.location||"",
      district:f.district||"",man:+f.man||0,terrain:+f.terrain||0,aerial:+f.aerial||0,time:t,important:!!f.important}; }).filter(f=>isFinite(f.lat)&&isFinite(f.lon)&&f.lat);
}
async function loadActivity(){
  try{ S.act=await loadProciv(); S.actSrc="Proteção Civil (ANEPC)"; LS.set("c:act",{t:Date.now(),d:S.act,src:S.actSrc}); }
  catch(e){ try{ S.act=await loadFogos(); S.actSrc="ANEPC via fogos.pt"; }
    catch(e2){ const c=LS.get("c:act"); if(c){ S.act=c.d.map(x=>({...x,time:x.time?new Date(x.time):null})); S.actSrc=c.src+" (guardado)"; } else throw e2; } }
  S.act.forEach(a=>a.kind=kindOf(a.nat));
}
function kindOf(n){ n=(n||"").toLowerCase();
  if(/inc[eê]nd|fogo|mato|povoamento|agr[ií]col|florest|queima|habitac|industr/.test(n)) return "fire";
  if(/acidente|rodovi|colis|despiste|atropel|ferrovi/.test(n)) return "car";
  if(/[aá]rvore|queda|derrocada|movimento de massa|estrutura/.test(n)) return "tree";
  if(/inunda|cheia|alagamento|[aá]gua/.test(n)) return "water";
  if(/sa[uú]de|doen|assist[eê]ncia|pr[eé]-hospital|emerg[eê]ncia m[eé]d/.test(n)) return "amb";
  return "alert"; }
const KIND={fire:["#ff7043","#3b1d14",P.fire,"Incêndio"],car:["#4fc3f7","#13303b",P.car,"Acidente"],tree:["#aed581","#26331a",P.tree,"Queda / estrutura"],water:["#4fc3f7","#13303b",P.water,"Inundação"],amb:["#ef5350","#3b1515",P.amb,"Saúde"],alert:["#ffd54f","#3b3410",P.alert,"Outra"]};

async function loadQuakes(){
  const out=[];
  for(const a of [7,3]){ try{ const r=await getJSON(IPMA+"/observation/seismic/"+a+".json",{key:"sis"+a});
    for(const q of (r.data&&r.data.data)||[]){ const lat=parseFloat(q.lat),lon=parseFloat(q.lon); if(isNaN(lat)) continue;
      out.push({id:q.sismoId||(q.time+lat),lat,lon,mag:parseFloat(q.magnitud),depth:q.depth,region:q.obsRegion||q.local||"—",time:new Date(q.time),felt:q.degree||q.sensed||null}); } }catch(e){ if(a===7) throw e; } }
  S.quakes=out.sort((a,b)=>b.time-a.time);
}

async function loadAq(){ const h=here(); S.aq=(await getJSON(`https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${h.lat}&longitude=${h.lon}&current=european_aqi,pm2_5,pm10&timezone=Europe%2FLisbon`,{key:"aq"})).data; }

/* Falhas de energia — dados abertos E-REDES (Opendatasoft). Campos lidos de forma flexível. */
async function loadOutages(){
  const r=await getJSON("https://e-redes.opendatasoft.com/api/explore/v2.1/catalog/datasets/outages-per-geography/records?limit=100",{key:"out"});
  const rows=r.data.results||[];
  const items=rows.map(x=>({ where:String(pick(x,/concelho|municip/i)||pick(x,/zip|postal|cp|codigo/i)||pick(x,/distrito/i)||"—"),
    district:String(pick(x,/distrito/i)||""), n:+(pick(x,/count|n_|num|total|outage|interrup|avaria/i))||1,
    raw:x }));
  S.outages={ items, t:r.t, stale:r.stale };
}

/* Abrigos e pontos seguros — OpenStreetMap (Overpass) */
const SHCAT={ shelter:["Abrigo","#ffeb3b",P.bunker], bunker:["Bunker","#ffeb3b",P.bunker], assembly:["Ponto de encontro","#81c784",P.people], hospital:["Hospital","#ef5350",P.hosp], fire:["Bombeiros","#ff7043",P.fire], police:["Polícia / GNR","#4fc3f7",P.police] };
function shCat(t){ if(t.emergency==="assembly_point") return "assembly"; if(t.military==="bunker"||t.building==="bunker") return "bunker"; if(t.amenity==="hospital") return "hospital"; if(t.amenity==="fire_station") return "fire"; if(t.amenity==="police") return "police"; if(t.amenity==="shelter") return "shelter"; return null; }
async function loadShelters(lat,lon,rKm){
  const r=Math.round(rKm*1000);
  const q=`[out:json][timeout:30];(nwr["amenity"="shelter"]["shelter_type"!="public_transport"]["shelter_type"!="picnic_shelter"](around:${r},${lat},${lon});nwr["military"="bunker"](around:${r},${lat},${lon});nwr["building"="bunker"](around:${r},${lat},${lon});nwr["emergency"="assembly_point"](around:${r},${lat},${lon});nwr["amenity"="hospital"](around:${r},${lat},${lon});nwr["amenity"="fire_station"](around:${r},${lat},${lon});nwr["amenity"="police"](around:${r},${lat},${lon}););out center 1500;`;
  const res=await getJSON("https://overpass-api.de/api/interpreter",{opts:{method:"POST",body:"data="+encodeURIComponent(q),headers:{"Content-Type":"application/x-www-form-urlencoded"}}});
  return (res.data.elements||[]).map(e=>{ const t=e.tags||{}; const c=shCat(t); const la=e.lat??e.center?.lat, lo=e.lon??e.center?.lon; if(!c||la==null) return null;
    return { id:e.type[0]+e.id, cat:c, lat:la, lon:lo, name:t.name||SHCAT[c][0], phone:t.phone||t["contact:phone"]||"", addr:[t["addr:street"],t["addr:housenumber"],t["addr:city"]].filter(Boolean).join(" ") }; }).filter(Boolean);
}

const WMO={0:"Céu limpo",1:"Pouco nublado",2:"Parcialmente nublado",3:"Nublado",45:"Nevoeiro",48:"Nevoeiro",51:"Chuvisco fraco",53:"Chuvisco",55:"Chuvisco forte",61:"Chuva fraca",63:"Chuva",65:"Chuva forte",66:"Chuva gelada",67:"Chuva gelada",71:"Neve fraca",73:"Neve",75:"Neve forte",77:"Neve",80:"Aguaceiros fracos",81:"Aguaceiros",82:"Aguaceiros fortes",85:"Aguaceiros de neve",86:"Aguaceiros de neve",95:"Trovoada",96:"Trovoada com granizo",99:"Trovoada com granizo"};
function wxIcon(c){ const sun='<circle cx="12" cy="12" r="4" stroke="#ffd54f"/><path stroke="#ffd54f" d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.4 1.4M17.6 17.6L19 19M5 19l1.4-1.4M17.6 6.4L19 5"/>';

  const rain='<path stroke="#cac4d0" d="M7 14h10a4 4 0 0 0 0-8 6 6 0 0 0-11.5 1.5A3.3 3.3 0 0 0 7 14z"/><path stroke="#4fc3f7" d="M8 17l-1 3M12 17l-1 3M16 17l-1 3"/>';

function aqBand(v){ if(v==null) return ["—","#938f99"]; if(v<=20) return ["Boa","#4caf50"]; if(v<=40) return ["Razoável","#8bc34a"]; if(v<=60) return ["Moderada","#ffd54f"]; if(v<=80) return ["Fraca","#ff9800"]; if(v<=100) return ["Muito fraca","#ff5449"]; return ["Extremamente fraca","#d500f9"]; }
const RCMN={1:"Reduzido",2:"Moderado",3:"Elevado",4:"Muito elevado",5:"Máximo"}; const RCMC={1:"#4caf50",2:"#ffd54f",3:"#ff9800",4:"#ff5449",5:"#d32f2f"};
function rcmAt(h,d){ const r=S.rcm[d]; if(!r||!r.local) return null; let b=null,bd=1e9; for(const[dico,l] of Object.entries(r.local)){ const la=+l.latitude,lo=+l.longitude; if(!isFinite(la)) continue; const dd=km(h.lat,h.lon,la,lo); if(dd<bd){bd=dd;b={dico,v:l.data&&l.data.rcm};} } return b; }

function stories(){ const out=[]; const now=Date.now();
  S.warnings.filter(w=>LVL[w.lvl]>=2).forEach(w=>out.push({k:"w",ref:w.id,time:w.start>now?new Date():w.start,t:`Aviso ${LVN[w.lvl].toLowerCase()}: ${w.type.toLowerCase()} em ${areaName(w.area)}`,s:"IPMA",tags:`<span class="tag off">Oficial</span>`,c1:w.lvl==="red"?"#7f1d1d":"#7a3e00",c2:"#1e1e1e"}));
  S.act.filter(a=>a.important||a.man>=60||a.aerial>=2).forEach(a=>out.push({k:"a",ref:a.id,time:a.time||new Date(),t:`${a.nat}${a.loc?" em "+a.loc.split(",").pop().trim():""}`,s:`${a.man} operacionais${a.aerial?` · ${a.aerial} meios aéreos`:""}`,tags:`<span class="tag live">Ao vivo</span>`,c1:"#5a1f0e",c2:"#1e1e1e"}));
  S.quakes.filter(q=>(q.felt||q.mag>=3.5)&&now-q.time<48*3600e3).forEach(q=>out.push({k:"q",ref:q.id,time:q.time,t:`Sismo de magnitude ${num(q.mag,1)} — ${q.region}`,s:q.felt?"Sentido pela população":"IPMA",tags:`<span class="tag off">Oficial</span>`,c1:"#3b1f6b",c2:"#1e1e1e"}));
  return out.sort((a,b)=>b.time-a.time); }

  $("#shA").onclick=()=>shareIt(x.nat,`${x.nat} — ${x.loc} (${x.status}). ${x.man} operacionais.`,""); }
function sheetWarn(w){ if(!w) return;

   <div class="row"><a class="btn y" href="https://www.ipma.pt/pt/otempo/prev-sam/?p=${encodeURIComponent(w.area)}" target="_blank" rel="noopener">Ver aviso oficial</a><button class="btn" id="shW">${ic(P.share,"i s")}Partilhar</button></div>

function sheetQuake(q){ if(!q) return; const h=here();
  openSheet(`<span class="tag" style="background:#2a1f3d;color:#b388ff">Sismo</span><h3>Magnitude ${num(q.mag,1)} — ${esc(q.region)}</h3>
   <dl class="kv"><dt>Hora</dt><dd>${fDT(q.time)} (${ago(q.time)})</dd><dt>Profundidade</dt><dd>${num(q.depth)} km</dd><dt>Distância</dt><dd>${fKm(km(h.lat,h.lon,q.lat,q.lon))}</dd><dt>Sentido</dt><dd>${q.felt?esc(q.felt):"Sem registo"}</dd></dl>
   <div class="row"><a class="btn y" href="https://www.ipma.pt/pt/geofisica/sismologia/" target="_blank" rel="noopener">Ver fonte oficial</a><button class="btn" data-guide="sismo">O que fazer num sismo</button></div>`);
  $("#sheet [data-guide]").onclick=()=>{ closeSheet(); go("perfil"); openGuide("sismo"); }; }
function sheetShelter(s){ if(!s) return; const c=SHCAT[s.cat]; const bm=LS.get("bm",[]); const on=bm.some(x=>x.id===s.id); const h=here();
  openSheet(`<span class="tag" style="background:${c[1]};color:#1a1a1a">${c[0]}</span><h3>${esc(s.name)}</h3><div class="muted">${esc(s.addr||"")} ${fKm(km(h.lat,h.lon,s.lat,s.lon))}</div>
   ${s.phone?`<dl class="kv"><dt>Telefone</dt><dd class="mono">${esc(s.phone)}</dd></dl>`:""}
   <div class="row"><a class="btn y" href="${dirUrl(s.lat,s.lon)}" target="_blank" rel="noopener">${ic(P.nav,"i s")}Obter direções</a><button class="btn" id="bmB">${ic(P.star,"i s")}${on?"Remover dos favoritos":"Guardar"}</button><button class="btn" id="shS">${ic(P.share,"i s")}Partilhar</button></div>
   <p class="small muted">Dados © OpenStreetMap. Confirme sempre no local; nem todos os abrigos estão abertos ao público.</p>`);
  $("#bmB").onclick=()=>{ let b=LS.get("bm",[]); if(b.some(x=>x.id===s.id)){ b=b.filter(x=>x.id!==s.id); toast("Removido dos favoritos"); } else { b.unshift(s); toast("Guardado nos favoritos"); } LS.set("bm",b); sheetShelter(s); };
  $("#shS").onclick=()=>shareIt(s.name,`${s.name} (${c[0]})`,`https://www.openstreetmap.org/?mlat=${s.lat}&mlon=${s.lon}#map=17/${s.lat}/${s.lon}`); }
function openStory(s){ if(!s) return; if(s.k==="w") sheetWarn(S.warnings.find(x=>x.id===s.ref)); else if(s.k==="a") sheetAct(S.act.find(x=>x.id===s.ref)); else sheetQuake(S.quakes.find(x=>x.id===s.ref)); }
function sheetStories(){ const st=stories(); const day=d=>{ const t=new Date(); t.setHours(0,0,0,0); return d>=t?"Hoje":d>=t-864e5?"Ontem":"Antes"; };
  let g={}; st.forEach((s,i)=>(g[day(s.time)]=g[day(s.time)]||[]).push([s,i]));
  openSheet(`<h3>Última hora</h3>`+["Hoje","Ontem","Antes"].filter(k=>g[k]).map(k=>`<div class="gtitle" style="margin:14px 0 6px">${k}</div>`+g[k].map(([s,i])=>`<button class="act" data-sti="${i}"><span class="am"><span class="t">${s.tags} ${esc(s.t)}</span><span class="s">${esc(s.s)} · ${ago(s.time)}</span></span></button>`).join("")).join(""));
  $("#sheet").querySelectorAll("[data-sti]").forEach(b=>b.onclick=()=>openStory(st[+b.dataset.sti])); }
function sheetHistory(){ const h=here(), a=nearestArea(h.lat,h.lon); const l=LS.get("hist",[]).filter(x=>x.area===a&&new Date(x.end)<Date.now());
  openSheet(`<h3>Alertas arquivados</h3><div class="muted small">${esc(areaName(a))} · últimos 30 dias (guardados neste telemóvel)</div>`+(l.length?l.map(x=>`<div class="act" style="cursor:default"><span class="ai" style="--ac:#1a1a1a;--ac-bg:${LVC[x.lvl]}">${ic(P.alert)}</span><span class="am"><span class="t">${esc(x.type)} · ${LVN[x.lvl]}</span><span class="m">${fDT(new Date(x.start))} → ${fDT(new Date(x.end))}</span></span></div>`).join(""):`<p class="empty">Sem alertas nos últimos 30 dias.</p>`)); }

let map, G={}, curMode="tudo", style="std", radarLayer, satLayer;
const MODES=[["tudo","Tudo"],["alertas","Alertas"],["atividade","Atividade"],["abrigos","Abrigos"],["sismos","Sismos"],["ambiente","Ambiente"],["radar","Radar de chuva"],["satelite","Imagem de satélite"]];
function baseLayer(s){
  if(s==="sat") return L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",{maxZoom:19,attribution:"Imagens © Esri"});
  return L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png",{maxZoom:19,subdomains:"abcd",attribution:'© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> © <a href="https://carto.com/attributions">CARTO</a>'});
}
let baseL, labelsL;
function setStyle(s){ style=s; if(baseL) map.removeLayer(baseL); if(labelsL) map.removeLayer(labelsL);
  baseL=baseLayer(s==="std"?"std":"sat").addTo(map); baseL.bringToBack();
  if(s==="hyb") labelsL=L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_only_labels/{z}/{x}/{y}{r}.png",{subdomains:"abcd",maxZoom:19,pane:"overlayPane"}).addTo(map); }
function initMap(){
  if(map){ map.invalidateSize(); return; }
  const h=here(); map=L.map("map",{zoomControl:false,attributionControl:true,worldCopyJump:true}).setView([h.lat,h.lon],9);
  setStyle("std");
  ["me","alertas","atividade","abrigos","sismos","ambiente"].forEach(k=>G[k]=L.layerGroup());
  G.me.addTo(map);
  $("#modes").innerHTML=MODES.map(([k,n])=>`<button class="chip" data-m="${k}" aria-pressed="${k===curMode}">${n}</button>`).join("");
  $("#modes").querySelectorAll(".chip").forEach(b=>b.onclick=()=>setMode(b.dataset.m));
  $("#styleBtn").onclick=()=>{ const n={std:"sat",sat:"hyb",hyb:"std"}[style]; setStyle(n); toast({std:"Mapa padrão",sat:"Satélite",hyb:"Híbrido"}[n]); };
  $("#meBtn").onclick=()=>{ const h=here(); map.setView([h.lat,h.lon],11); };
  map.on("moveend",()=>{ if(curMode==="abrigos"||curMode==="tudo") maybeLoadShelters(); });
  drawMap(); setMode(curMode);
}
function pinIcon(color,inner,size=30){ return L.divIcon({className:"",iconSize:[size,size],iconAnchor:[size/2,size],html:`<div class="pin" style="background:${color};width:${size}px;height:${size}px;color:#121212"><span>${inner}</span></div>`}); }
function dotIcon(color,txt,size){ return L.divIcon({className:"",iconSize:[size,size],iconAnchor:[size/2,size/2],html:`<div class="dotm" style="--dc:${color};background:${color};width:${size}px;height:${size}px">${txt||""}</div>`}); }
function drawMap(){
  if(!map) return; const h=here();
  G.me.clearLayers(); L.circleMarker([h.lat,h.lon],{radius:9,color:"#121212",weight:3,fillColor:"#ffeb3b",fillOpacity:1}).addTo(G.me);
  L.circle([h.lat,h.lon],{radius:cfg.radius*1000,color:"#ffeb3b",weight:1,opacity:.6,fill:false,dashArray:"4 6",interactive:false}).addTo(G.me);
  G.atividade.clearLayers(); S.act.forEach(a=>{ const k=KIND[a.kind]||KIND.alert; L.marker([a.lat,a.lon],{icon:pinIcon(k[0],`<svg class="i s" viewBox="0 0 24 24" style="width:15px;height:15px">${k[2]}</svg>`)}).on("click",()=>sheetAct(a)).addTo(G.atividade); });
  G.sismos.clearLayers(); S.quakes.forEach(q=>{ const age=(Date.now()-q.time)/864e5; const s=Math.round(14+Math.max(0,q.mag||0)*5); L.marker([q.lat,q.lon],{icon:dotIcon(age<1?"#b388ff":age<7?"#7e57c2":"#4a3a6a",(q.mag>=2.5?num(q.mag,1):""),s),opacity:age<7?1:.6}).on("click",()=>sheetQuake(q)).addTo(G.sismos); });
  G.alertas.clearLayers(); const byA={}; S.warnings.forEach(w=>{ if(!byA[w.area]||LVL[w.lvl]>LVL[byA[w.area].lvl]) byA[w.area]=w; });
  Object.values(byA).forEach(w=>{ const a=AREAS[w.area]; if(!a) return; L.circle([a[1],a[2]],{radius:w.area.length&&/^M|^A[OC]/.test(w.area)?18000:32000,color:LVC[w.lvl],weight:2,fillColor:LVC[w.lvl],fillOpacity:.25}).on("click",()=>sheetWarn(w)).addTo(G.alertas);
    L.marker([a[1],a[2]],{icon:pinIcon(LVC[w.lvl],`<svg class="i s" viewBox="0 0 24 24" style="width:15px;height:15px">${P.alert}</svg>`)}).on("click",()=>sheetWarn(w)).addTo(G.alertas); });
  G.ambiente.clearLayers(); const r=S.rcm[0]; if(r&&r.local) Object.values(r.local).forEach(l=>{ const v=l.data&&l.data.rcm; if(!v) return; L.circleMarker([+l.latitude,+l.longitude],{radius:7,stroke:false,fillColor:RCMC[v],fillOpacity:.7}).bindTooltip(`Risco de incêndio: ${RCMN[v]}`).addTo(G.ambiente); });
  drawShelters();
}
function drawShelters(){ if(!map) return; G.abrigos.clearLayers(); const bm=new Set(LS.get("bm",[]).map(x=>x.id));
  const list=[...S.shelters,...LS.get("bm",[]).filter(b=>!S.shelters.some(s=>s.id===b.id))];
  list.forEach(s=>{ const c=SHCAT[s.cat]; L.marker([s.lat,s.lon],{icon:pinIcon(c[1],`<svg class="i s" viewBox="0 0 24 24" style="width:15px;height:15px">${bm.has(s.id)?P.star:c[2]}</svg>`,s.cat==="bunker"||s.cat==="shelter"?32:26)}).on("click",()=>sheetShelter(s)).addTo(G.abrigos); }); }
let shLast=null, shBusy=false;
async function maybeLoadShelters(){ if(shBusy||map.getZoom()<8) return; const c=map.getCenter(); if(shLast&&km(c.lat,c.lng,shLast.lat,shLast.lng)<8) return;
  shBusy=true; $("#mlegend").textContent="A procurar abrigos e pontos seguros…";
  try{ const add=await loadShelters(c.lat,c.lng,15); const ids=new Set(S.shelters.map(x=>x.id)); add.forEach(x=>{ if(!ids.has(x.id)) S.shelters.push(x); }); shLast=c; drawShelters(); legend(); }
  catch(e){ $("#mlegend").textContent="O OpenStreetMap não respondeu. Mova o mapa para tentar de novo."; }
  shBusy=false; }
async function setMode(m){
  curMode=m; if(!map){ return; }
  $("#modes").querySelectorAll(".chip").forEach(b=>b.setAttribute("aria-pressed",b.dataset.m===m));
  const show={tudo:["alertas","atividade","abrigos","sismos"],alertas:["alertas"],atividade:["atividade"],abrigos:["abrigos"],sismos:["sismos"],ambiente:["ambiente"],radar:["alertas"],satelite:[]}[m]||[];
  ["alertas","atividade","abrigos","sismos","ambiente"].forEach(k=>show.includes(k)?G[k].addTo(map):map.removeLayer(G[k]));
  if(radarLayer){ map.removeLayer(radarLayer); } if(satLayer){ map.removeLayer(satLayer); }
  if(m==="radar"){ try{ const r=await getJSON("https://api.rainviewer.com/public/weather-maps.json"); const p=r.data.radar.past, last=p[p.length-1];
      radarLayer=L.tileLayer(`${r.data.host}${last.path}/256/{z}/{x}/{y}/2/1_1.png`,{opacity:.75,maxNativeZoom:7,maxZoom:19,attribution:"Radar © RainViewer"}).addTo(map); S.radarT=new Date(last.time*1000);
      if(map.getZoom()>8) map.setZoom(7); }catch(e){ toast("Não foi possível carregar o radar."); } }
  if(m==="satelite"){ const d=new Date(Date.now()-864e5).toISOString().slice(0,10);
    satLayer=L.tileLayer(`https://gibs.earthdata.nasa.gov/wmts/epsg3857/best/VIIRS_SNPP_CorrectedReflectance_TrueColor/default/${d}/GoogleMapsCompatible_Level9/{z}/{y}/{x}.jpg`,{maxNativeZoom:9,maxZoom:19,attribution:"Imagem: NASA GIBS (VIIRS)"}).addTo(map); S.satD=d; if(map.getZoom()>8) map.setZoom(6); }
  if(m==="abrigos"&&map.getZoom()<11){ const c=map.getCenter(); map.setView(c,11); }
  if(m==="abrigos"||m==="tudo") maybeLoadShelters();
  legend(); }
function legend(){ const h=here(); const m=curMode; let t="";
  if(m==="tudo") t=`${S.warnings.filter(w=>w.area===nearestArea(h.lat,h.lon)).length} alertas · ${S.act.length} ocorrências · ${S.shelters.length} pontos seguros`;
  if(m==="alertas") t=`${S.warnings.length} avisos IPMA ativos ou previstos`;
  if(m==="atividade") t=`${S.act.length} ocorrências ativas · ${S.actSrc}`;
  if(m==="abrigos") t=`${S.shelters.length} abrigos, bunkers e pontos seguros (aproxime para ver mais)`;
  if(m==="sismos") t=`${S.quakes.length} sismos nos últimos 30 dias · IPMA`;
  if(m==="ambiente") t=`Risco de incêndio hoje por concelho · IPMA`;
  if(m==="radar") t=S.radarT?`Radar de chuva às ${TF.format(S.radarT)}`:"Radar de chuva";
  if(m==="satelite") t=`Imagem de satélite de ${S.satD||"ontem"} · NASA`;
  $("#mlegend").textContent=t; }

let qT; $("#mq").oninput=e=>{ const q=e.target.value.trim(); $("#mqClear").hidden=!q; clearTimeout(qT); if(q.length<2){ $("#sres").hidden=true; return; }
  qT=setTimeout(async()=>{ const ql=q.toLowerCase(); const res=[];
    S.warnings.filter(w=>(areaName(w.area)+" "+w.type).toLowerCase().includes(ql)).slice(0,3).forEach(w=>res.push({ic:P.alert,c:LVC[w.lvl],t:`${w.type} — ${areaName(w.area)}`,s:`Aviso ${LVN[w.lvl].toLowerCase()}`,go:()=>sheetWarn(w)}));
    S.act.filter(a=>(a.nat+" "+a.loc+" "+a.district).toLowerCase().includes(ql)).slice(0,4).forEach(a=>res.push({ic:(KIND[a.kind]||KIND.alert)[2],c:(KIND[a.kind]||KIND.alert)[0],t:a.nat,s:a.loc,go:()=>{ map.setView([a.lat,a.lon],12); sheetAct(a); }}));
    S.shelters.filter(s=>s.name.toLowerCase().includes(ql)).slice(0,4).forEach(s=>res.push({ic:SHCAT[s.cat][2],c:SHCAT[s.cat][1],t:s.name,s:SHCAT[s.cat][0],go:()=>{ map.setView([s.lat,s.lon],15); sheetShelter(s); }}));
    try{ const r=await getJSON(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=5&language=pt&format=json`);
      (r.data.results||[]).forEach(x=>res.push({ic:P.pin,c:"#cac4d0",t:x.name,s:[x.admin2,x.admin1,x.country].filter(Boolean).join(", "),go:()=>map.setView([x.latitude,x.longitude],11)})); }catch(e){}
    $("#sres").innerHTML=res.length?res.map((r,i)=>`<button data-i="${i}"><span style="color:${r.c}">${ic(r.ic,"i s")}</span><span style="min-width:0"><b style="font-weight:500">${esc(r.t)}</b><br><span class="small muted">${esc(r.s)}</span></span></button>`).join(""):`<div class="empty" style="padding:14px 16px">Sem resultados</div>`;
    $("#sres").hidden=false; $("#sres").querySelectorAll("button").forEach(b=>b.onclick=()=>{ res[+b.dataset.i].go(); $("#sres").hidden=true; $("#mq").blur(); }); },300); };
$("#mqClear").onclick=()=>{ $("#mq").value=""; $("#sres").hidden=true; $("#mqClear").hidden=true; };

const item=(p,i,t,s)=>`<button class="item" data-p="${p}"><span class="ii">${ic(i)}</span><span class="it"><b>${t}</b><span>${s}</span></span>${ic(P.chev,"i s muted")}</button>`;
const hdr=(t,back="home")=>`<div class="ptitle"><button class="back" data-back="${back}" aria-label="Voltar">${ic(P.back)}</button><h1>${esc(t)}</h1></div>`;
const sw=(id,label,val)=>`<label class="item" for="sw_${id}"><span class="it"><b>${esc(label)}</b></span><input type="checkbox" class="sw" id="sw_${id}" data-k="${id}" ${(val??cfg[id])?"checked":""}></label>`;
async function swChange(c){ const k=c.dataset.k, v=c.checked;
  if(k.startsWith("t_")) cfg.nTypes[k.slice(2)]=v; else if(k.startsWith("city_")){ const ct=cfg.cities.find(x=>x.id===k.slice(5)); if(ct) ct.notify=v; } else cfg[k]=v;
  save(); if(v&&(k==="nAlerts"||k==="nAct")) await askNotif(); if(k==="breakingDash") renderWidgets(); }
function openGuide(id){ page="guide:"+id; renderProfile(); window.scrollTo(0,0); }
async function profAction(p){
  if(p==="wipe"){ openSheet(`<h3>Apagar todos os dados?</h3><p>Isto apaga favoritos, abrigos offline, histórico, kit e definições deste telemóvel. Não dá para desfazer.</p><div class="row"><button class="btn" id="noW">Cancelar</button><button class="btn" style="background:#93000a;color:#ffdad6" id="yesW">Apagar</button></div>`);
    $("#noW").onclick=closeSheet; $("#yesW").onclick=()=>{ LS.clear(); cfg=structuredClone(DEF); cfg.onboarded=true; save(); closeSheet(); toast("Dados apagados"); page="home"; renderProfile(); refresh(); }; return; }
  if(p==="dlSh"){ const h=here(); toast("A descarregar abrigos…"); try{ const l=await loadShelters(h.lat,h.lon,25); LS.set("offSh",{t:Date.now(),place:h.name,items:l}); toast(`${l.length} abrigos descarregados`); }catch(e){ toast("Não foi possível descarregar. Tente mais tarde."); } renderProfile(); return; }
  if(p==="seeOff"){ page="offlist"; renderProfile(); return; }
  if(p==="delOff"){ LS.del("offSh"); toast("Dados offline apagados"); renderProfile(); return; }
  page=p; renderProfile(); window.scrollTo(0,0);
}

function openCustomize(){
  const draw=()=>{ $("#sheet").innerHTML=`<div class="grab"></div><h3>Blocos do painel</h3><p class="small">Escolha o que aparece e por que ordem.</p><ul class="custom">`+
    cfg.layout.map((w,i)=>`<li><input type="checkbox" class="sw" data-i="${i}" ${w.on?"checked":""} aria-label="Mostrar"><span style="flex:1">${esc((WIDGETS.find(x=>x[0]===w.id)||[0,w.id])[1])}</span><button class="mv" data-up="${i}" aria-label="Subir">${ic(P.up,"i s")}</button><button class="mv" data-dn="${i}" aria-label="Descer">${ic(P.down,"i s")}</button></li>`).join("")+
    `</ul><div class="row"><button class="btn t" id="resetL">Repor disposição predefinida</button><button class="btn y" id="doneL" style="margin-left:auto">Concluído</button></div>`;
    const sh=$("#sheet");
    sh.querySelectorAll("[data-i]").forEach(c=>c.onchange=()=>{ cfg.layout[+c.dataset.i].on=c.checked; save(); renderWidgets(); });
    sh.querySelectorAll("[data-up]").forEach(b=>b.onclick=()=>{ const i=+b.dataset.up; if(i>0){ [cfg.layout[i-1],cfg.layout[i]]=[cfg.layout[i],cfg.layout[i-1]]; save(); renderWidgets(); draw(); } });
    sh.querySelectorAll("[data-dn]").forEach(b=>b.onclick=()=>{ const i=+b.dataset.dn; if(i<cfg.layout.length-1){ [cfg.layout[i+1],cfg.layout[i]]=[cfg.layout[i],cfg.layout[i+1]]; save(); renderWidgets(); draw(); } });
    $("#resetL").onclick=()=>{ cfg.layout=structuredClone(DEF.layout); save(); renderWidgets(); draw(); }; $("#doneL").onclick=closeSheet; };
  $("#sheetWrap").hidden=false; draw();
}
$("#customBtn").onclick=openCustomize;

/* Cidades seguidas e pesquisa de locais */
function placeSearch(input,out,onPick){ let t; input.oninput=()=>{ clearTimeout(t); const q=input.value.trim(); if(q.length<2){ out.innerHTML=""; return; }
  t=setTimeout(async()=>{ try{ const r=await getJSON(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=8&language=pt&format=json`); const res=r.data.results||[];
    out.innerHTML=res.length?`<div class="group" style="margin-top:8px">`+res.map((x,i)=>`<button class="item" data-i="${i}"><span class="ii">${ic(P.pin)}</span><span class="it"><b>${esc(x.name)}</b><span>${esc([x.admin2,x.admin1,x.country].filter(Boolean).join(", "))}</span></span></button>`).join("")+`</div>`:`<div class="empty">Sem resultados</div>`;
    out.querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>onPick(res[+b.dataset.i])); }catch(e){ out.innerHTML=`<div class="err">A pesquisa falhou. Verifique a ligação.</div>`; } },300); }; }
function openCityPicker(){
  openSheet(`<h3>Seguir uma cidade</h3><p class="small">Veja alertas e atividade de outro sítio, por exemplo onde vive a família ou onde trabalha.</p><input class="inp" id="cityQ" placeholder="Nome da localidade" autocomplete="off"><div id="cityR"></div>`);
  setTimeout(()=>$("#cityQ").focus(),100);
  placeSearch($("#cityQ"),$("#cityR"),x=>{ const id="c"+Math.round(x.latitude*1000)+"_"+Math.round(x.longitude*1000); if(!cfg.cities.find(c=>c.id===id)) cfg.cities.push({id,name:x.name,lat:x.latitude,lon:x.longitude,notify:true}); cfg.sel=id; save(); closeSheet(); toast("A seguir "+x.name); renderPlaces(); if(page==="nAlerts") renderProfile(); refresh(); });
}
function useGPS(after){
  if(!navigator.geolocation){ toast("Este browser não dá acesso à localização."); after&&after(); return; }
  navigator.geolocation.getCurrentPosition(async p=>{ const lat=p.coords.latitude,lon=p.coords.longitude; let name="A minha localização";
    try{ const r=await getJSON(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&zoom=10&accept-language=pt`); const a=r.data.address||{}; name=a.city||a.town||a.village||a.municipality||a.county||name; }catch(e){}
    cfg.me={lat,lon,name}; cfg.gps=true; cfg.sel="me"; save(); renderPlaces(); if(page==="loc") renderProfile(); refresh(); after&&after(); },
    e=>{ toast(e.code===1?"Acesso à localização recusado. Pode escolher a localidade no Perfil.":"Não foi possível obter a localização."); after&&after(); },{timeout:15000,maximumAge:600000}); }

/* ======================================================================
   NOTIFICAÇÕES
   ====================================================================== */
async function askNotif(){ if(!("Notification" in window)){ toast("Este browser não suporta notificações."); return false; } if(Notification.permission==="granted") return true;
  if(Notification.permission==="denied"){ toast("As notificações estão bloqueadas nas definições do telemóvel."); return false; } const p=await Notification.requestPermission(); renderWidgets(); return p==="granted"; }
function inQuiet(){ if(!cfg.quiet) return false; const n=new Date(), m=n.getHours()*60+n.getMinutes(); const [a,b]=[cfg.qFrom,cfg.qTo].map(s=>{ const[h,mm]=s.split(":").map(Number); return h*60+mm; }); return a<b?(m>=a&&m<b):(m>=a||m<b); }
async function notify(title,body,tag,critical){ if(!("Notification" in window)||Notification.permission!=="granted") return; if(!critical&&inQuiet()) return;
  try{ const reg=navigator.serviceWorker&&await navigator.serviceWorker.getRegistration(); if(reg) reg.showNotification(title,{body,tag,icon:"icons/icon-192.png",badge:"icons/icon-192.png"}); else new Notification(title,{body,tag}); }catch(e){} }
function checkNotify(){
  const seen=new Set(LS.get("seen",[])), first=!LS.get("seenInit",false), add=[];
  const places=[{...cfg.me,name:cfg.me.name},...cfg.cities.filter(c=>c.notify!==false)];
  if(cfg.nAlerts){
    if(cfg.nTypes.meteo){ const areas=new Set(places.map(p=>nearestArea(p.lat,p.lon)));
      S.warnings.filter(w=>areas.has(w.area)&&LVL[w.lvl]>=LVL[cfg.nMinLvl]).forEach(w=>{ const k="w|"+w.id; if(!seen.has(k)){ add.push(k); if(!first) notify(`Aviso ${LVN[w.lvl].toLowerCase()}: ${w.type}`,`${areaName(w.area)} · ${fDT(w.start)} → ${fDT(w.end)}`,k,LVL[w.lvl]>=2); } }); }
    if(cfg.nTypes.incendio) S.act.filter(a=>a.kind==="fire").forEach(a=>{ const d=Math.min(...places.map(p=>km(p.lat,p.lon,a.lat,a.lon))); const k="f|"+a.id; if(d<=cfg.nDist&&!seen.has(k)){ add.push(k); if(!first) notify(`${a.nat} a ${fKm(d)}`,`${a.loc} · ${a.status}`,k,d<5); } });
    if(cfg.nTypes.sismo) S.quakes.forEach(q=>{ const d=Math.min(...places.map(p=>km(p.lat,p.lon,q.lat,q.lon))); const k="q|"+q.id; if(q.mag>=3&&d<=Math.max(cfg.nDist,100)&&Date.now()-q.time<864e5&&!seen.has(k)){ add.push(k); if(!first) notify(`Sismo M${num(q.mag,1)} a ${fKm(d)}`,`${q.region}, ${fDT(q.time)}`,k,q.mag>=4.5); } });
    if(cfg.nTypes.ar&&S.aq&&S.aq.current&&S.aq.current.european_aqi>60){ const k="ar|"+new Date().toDateString(); if(!seen.has(k)){ add.push(k); if(!first) notify("Qualidade do ar fraca",`Índice ${S.aq.current.european_aqi} em ${here().name}`,k,false); } }
  }
  if(cfg.nAct) S.act.forEach(a=>{ const d=km(cfg.me.lat,cfg.me.lon,a.lat,a.lon); const k="a|"+a.id; if(d<=cfg.nActR&&!seen.has(k)){ add.push(k); if(!first) notify(`${a.nat} perto de si (${fKm(d)})`,`${a.loc} · ${a.man} operacionais`,k,false); } });
  LS.set("seen",[...add,...seen].slice(0,1500)); LS.set("seenInit",true);
}

const ONB=[
  {art:"coast",t:"Quando importa,\nesteja pronto",p:"Em catástrofes naturais ou emergências, a sua segurança está à distância de um passo, se tiver a informação certa."},
  {art:"map",t:"Encontre os pontos\nseguros à sua volta",p:"Abrigos, bunkers, pontos de encontro, hospitais e bombeiros perto de si. A sua localização nunca sai do telemóvel.",cta:"loc"},
  {art:"bell",t:"A Sentinela também\nvigia por si",p:"Os abrigos são só o começo. A Sentinela acompanha o que se passa à sua volta.",chips:["Alertas oficiais","Mapas de perigos ao vivo","Painel de locais"],cta:"notif"}
];
function onboarding(i){
  const o=$("#onb"); o.hidden=false; const s=ONB[i];
  o.innerHTML=`<button class="skip" id="oSkip">Saltar</button><div class="art">${ART[s.art]}</div>
    <div class="dots">${ONB.map((_,j)=>`<i class="${j===i?"on":""}"></i>`).join("")}</div><h1>${esc(s.t)}</h1><p>${esc(s.p)}</p>
    ${s.chips?`<div class="ochips">${s.chips.map(c=>`<span>${esc(c)}</span>`).join("")}</div>`:""}
    ${s.cta==="loc"?`<button class="btn y full" id="oGo">Permitir acesso à localização</button><button class="btn t full" id="oNext">Talvez mais tarde</button>`
      :s.cta==="notif"?`<button class="btn y full" id="oGo">Ativar notificações</button><button class="btn t full" id="oNext">Agora não</button>`
      :`<button class="btn y full" id="oNext">Começar</button>`}`;
  const next=()=>{ if(i<ONB.length-1) onboarding(i+1); else finishOnb(); };
  $("#oSkip").onclick=finishOnb; $("#oNext").onclick=next;
  if($("#oGo")) $("#oGo").onclick=async()=>{ if(s.cta==="loc") useGPS(next); else { await askNotif(); next(); } };
}
function finishOnb(){ cfg.onboarded=true; save(); $("#onb").hidden=true; }

/* ======================================================================
   CICLO PRINCIPAL E NAVEGAÇÃO
   ====================================================================== */
let busy=false;
async function refresh(){
  if(busy) return; busy=true; $("#refreshBtn").classList.add("spin"); S.fails=[];
  $("#offlineBanner").hidden=navigator.onLine!==false;
  renderWidgets();
  const jobs=[["alertas",loadWarnings],["ocorrências",loadActivity],["sismos",loadQuakes],["risco de incêndio",loadRcm],["tempo",loadWx],["qualidade do ar",loadAq],["energia",loadOutages]];
  await Promise.all(jobs.map(async([n,f])=>{ try{ await f(); }catch(e){ console.warn(n,e); S.fails.push(n); } renderWidgets(); drawMap(); }));
  S.lastAct=S.act.reduce((m,a)=>a.time&&a.time>m?a.time:m,null);
  const off=LS.get("offSh"); if(off&&!S.shelters.length) S.shelters=off.items.slice();
  renderWidgets(); drawMap(); if(map) legend(); checkNotify();
  $("#lastUpd").innerHTML=`Atualizado às ${TF.format(new Date())}${S.fails.length?` · <span class="err">sem resposta: ${S.fails.join(", ")}</span>`:""}. Atualiza sozinho a cada 5 minutos.`;
  $("#refreshBtn").classList.remove("spin"); busy=false;
}
$("#refreshBtn").onclick=()=>refresh();
$("#nbOn").onclick=async()=>{ await askNotif(); renderWidgets(); };
$("#nbOff").onclick=()=>{ cfg.nbDismissed=true; save(); renderWidgets(); };

const VIEWS=["painel","mapa","perfil"];
function go(v){ if(!VIEWS.includes(v)) v="painel";
  VIEWS.forEach(x=>$("#v-"+x).hidden=x!==v);
  document.querySelectorAll("nav.bar button").forEach(b=>{ if(b.dataset.v===v) b.setAttribute("aria-current","page"); else b.removeAttribute("aria-current"); });
  if(location.hash!=="#"+v) history.replaceState(null,"","#"+v);
  if(v==="mapa") setTimeout(()=>{ initMap(); map.invalidateSize(); },30);
  if(v==="perfil") renderProfile();
  window.scrollTo(0,0); }
document.querySelectorAll("nav.bar button").forEach(b=>b.onclick=()=>{ if(b.dataset.v==="perfil"&&$("#v-perfil").hidden===false){ page="home"; } go(b.dataset.v); });
window.addEventListener("hashchange",()=>go(location.hash.slice(1)));
window.addEventListener("online",()=>refresh()); window.addEventListener("offline",()=>$("#offlineBanner").hidden=false);

renderPlaces();
go(location.hash.slice(1)||"painel");
if(!cfg.onboarded) onboarding(0);
refresh();
setInterval(()=>refresh(),5*60*1000);
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible"&&Date.now()-(refresh.l||0)>3*60e3){ refresh.l=Date.now(); refresh(); } });
if("serviceWorker" in navigator&&location.protocol==="https:") navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
