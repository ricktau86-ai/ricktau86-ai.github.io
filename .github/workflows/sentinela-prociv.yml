name: Sentinela - ocorrências Proteção Civil
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      debug:
        description: "Mostrar detalhes"
        default: "0"
      explorar:
        description: "Explorar o portal (só diagnóstico)"
        default: "0"
permissions:
  contents: write
concurrency:
  group: sentinela-prociv
  cancel-in-progress: false
jobs:
  recolher:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: sentinela/tools }
      - name: Explorar portal
        if: ${{ github.event.inputs.explorar == '1' }}
        run: python3 sentinela/tools/explorar.py; exit 1
      - name: Recolher ocorrências
        env: { DEBUG: "${{ github.event.inputs.debug || '0' }}" }
        run: python3 sentinela/tools/prociv.py /tmp/ocorrencias.json
      - name: Publicar no ramo "dados"
        run: |
          cd /tmp && rm -rf dados && mkdir dados && cd dados
          git init -q -b dados
          mkdir -p sentinela && cp /tmp/ocorrencias.json sentinela/ocorrencias.json
          git add . && git -c user.name="sentinela-bot" -c user.email="sentinela-bot@users.noreply.github.com" commit -q -m "Ocorrências $(date -u +%FT%TZ)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" dados
