name: Sentinela - APK Android
on:
  push:
    branches: [main]
    paths: ["sentinela/**", "!sentinela/Sentinela.apk", "sentinela-android/**", ".github/workflows/sentinela-apk.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sentinela-apk
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults: { run: { working-directory: sentinela-android } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Preparar a app web
        run: |
          npm install --no-audit --no-fund
          rm -rf www && mkdir www && cp -r ../sentinela/index.html ../sentinela/extra.js ../sentinela/noticias.js ../sentinela/tempestades.js ../sentinela/manifest.webmanifest ../sentinela/icons ../sentinela/vendor www/
      - name: Criar projeto Android
        run: |
          npx cap add android
          npx cap sync android
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          cp -r res/* android/app/src/main/res/
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />#' $M
          G=android/app/build.gradle
          sed -i -E "s/versionCode [0-9]+/versionCode $((100 + ${{ github.run_number }}))/; s/versionName \"[^\"]*\"/versionName \"1.${{ github.run_number }}\"/" $G
          cp sentinela.keystore android/app/sentinela.keystore
          # widget e verificação em segundo plano (código nativo)
          cp -r native/java/* android/app/src/main/java/
          cp -r native/res/* android/app/src/main/res/
          sed -i 's#</application>#    <receiver android:name=".SentinelaWidget" android:exported="true" android:label="Sentinela"><intent-filter><action android:name="android.appwidget.action.APPWIDGET_UPDATE" /></intent-filter><meta-data android:name="android.appwidget.provider" android:resource="@xml/widget_info" /></receiver>\n    </application>#' $M
          printf '\ndependencies {\n    implementation "androidx.work:work-runtime:2.9.1"\n}\n' >> $G
          grep -n "SentinelaWidget" $M
          cat >> $G <<'GRADLE'
          android {
              signingConfigs {
                  sentinela { storeFile file("sentinela.keystore"); storePassword "sentinela-apk"; keyAlias "sentinela"; keyPassword "sentinela-apk" }
              }
              buildTypes {
                  release { signingConfig signingConfigs.sentinela; minifyEnabled false }
                  debug { signingConfig signingConfigs.sentinela }
              }
          }
          GRADLE
          grep -n "versionCode\|versionName" $G
      - name: Compilar APK
        working-directory: sentinela-android/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -q
          cp app/build/outputs/apk/release/app-release.apk ../Sentinela.apk
          ls -la ../Sentinela.apk
      - uses: actions/upload-artifact@v4
        with: { name: Sentinela-apk, path: sentinela-android/Sentinela.apk }
      - name: Publicar em Releases (link fixo)
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release delete sentinela-apk --yes --cleanup-tag || true
          gh release create sentinela-apk Sentinela.apk --target "${{ github.sha }}" --title "Sentinela para Android (versão 1.${{ github.run_number }})" --notes "APK da Sentinela. Descarregar Sentinela.apk e instalar (permitir instalar de fontes desconhecidas)."
      - name: Pôr a APK no site (descarga direta)
        working-directory: .
        run: |
          git pull -q origin main || true
          cp sentinela-android/Sentinela.apk sentinela/Sentinela.apk
          git add sentinela/Sentinela.apk
          git -c user.name="sentinela-bot" -c user.email="sentinela-bot@users.noreply.github.com" commit -q -m "Sentinela: APK 1.${{ github.run_number }}" || exit 0
          git push -q origin HEAD:main
